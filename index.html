<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mount Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>

  <main class="page-wrap">
    <header class="topbar">
      <h1>Mount Planner</h1>
    </header>

    <div class="main-layout">
      <!-- 左侧主输入区 -->
      <div class="left-panel">
        <section class="card hero">
          <h2>坐骑属性规划</h2>
          <p>每个属性填写 Level / Limit / Max。点击「计算最少素材」得到结果。</p>
        </section>

        <section class="card">
          <form id="needForm" class="need-grid">
            <div class="triple-head">属性</div>
            <div class="triple-head">Level</div>
            <div class="triple-head">Limit</div>
            <div class="triple-head">Max</div>
          </form>

          <div class="actions actions-bar">
            <div class="actions-left">
              <button id="resetBtn" type="button" class="secondary">重置</button>
              <button id="copyLinkBtn" type="button" class="secondary">复制链接</button>
            </div>
            <div class="actions-right">
              <button id="solveBtn" type="button" class="primary">计算最少素材</button>
            </div>
          </div>
        </section>

        <section class="card result" id="resultCard" hidden>
          <h3>计算结果</h3>
          <div class="result-summary">
            <div class="result-stat" id="bestCountCard">
              <span class="result-stat-label">最少素材数量</span>
              <span class="result-stat-value" id="bestCount">-</span>
            </div>
            <div class="result-stat" id="levelCard">
              <span class="result-stat-label">材料等级</span>
              <span class="result-stat-value" id="selectedMaterialLevel">-</span>
            </div>
            <div class="result-stat" id="timeCard">
              <span class="result-stat-label">预计喂养时间</span>
              <span class="result-stat-value" id="timeEstimate">-</span>
            </div>
          </div>
          <table>
            <thead>
              <tr>
                <th>素材</th>
                <th>数量</th>
              </tr>
            </thead>
            <tbody id="usageBody"></tbody>
          </table>
          <div class="overflow-section">
            <h4>溢出点数</h4>
            <div id="overflowGrid" class="overflow-grid"></div>
          </div>
        </section>
      </div>

      <!-- 右侧配置区 -->
      <div class="right-panel">
        <section class="card config-card" id="ocrCard">
          <h3>截图识别 (OCR)</h3>
          <p class="hint">粘贴或上传图片后自动填充属性</p>
          <div class="ocr-row">
            <input id="ocrImageInput" type="file" accept="image/*" hidden />
            <button id="ocrRecognizeBtn" type="button" class="primary">选择文件并识别</button>
          </div>
          <p id="ocrStatus" class="hint"></p>
          <div class="ocr-row">
            <button id="showOriginalBtn" type="button" class="secondary">显示原图</button>
            <button id="showPreprocessedBtn" type="button" class="secondary">显示预处理</button>
            <span id="preprocHint" class="hint" style="margin:0"></span>
          </div>
          <div id="preprocCanvasWrap" hidden>
            <canvas id="preprocCanvas"></canvas>
          </div>
          <div id="originalCanvasWrap" hidden>
            <canvas id="originalCanvas"></canvas>
          </div>
        </section>

        <section class="card config-card">
          <h3>材料配置</h3>
          <div class="mode-row">
            <label for="materialMode">材料选择模式</label>
            <select id="materialMode">
              <option value="auto">自动优先最高可用等级</option>
              <option value="manual">手动指定等级</option>
              <option value="pick">手动指定材料</option>
            </select>
          </div>
          <div class="mode-row" id="manualRow" hidden>
            <label for="manualMaterialLevel">手动等级</label>
            <select id="manualMaterialLevel"></select>
          </div>
          <div class="mode-row" id="pickRow" hidden>
            <label>手动材料</label>
            <button id="pickMaterialBtn" type="button" class="primary">选择材料</button>
            <span id="pickStatus" class="hint" style="margin:0"></span>
          </div>
          <p id="modeHint" class="hint"></p>
        </section>
      </div>
    </div>
  </main>

  <!-- 材料选择弹窗 -->
  <div id="materialModal" class="modal-overlay" hidden>
    <div class="modal-content">
      <h3>选择可获取材料</h3>
      <p class="hint" style="margin:0 0 12px">勾选各等级下可获取的材料，同类型材料多选时自动使用最高等级</p>
      <div class="modal-table-wrap">
        <table class="material-table" id="materialTable">
          <thead>
            <tr>
              <th><input type="checkbox" id="selectAllCheck" /></th>
              <th>等级</th>
              <th>Ingot</th>
              <th>Gem</th>
              <th>Plank</th>
              <th>Paper</th>
              <th>String</th>
              <th>Grain</th>
              <th>Oil</th>
              <th>Meat</th>
            </tr>
          </thead>
          <tbody id="materialTbody"></tbody>
        </table>
      </div>
      <div class="modal-actions">
        <button id="modalConfirmBtn" type="button" class="primary">确认</button>
        <button id="modalCancelBtn" type="button">取消</button>
        <button id="modalClearBtn" type="button" class="danger">清空</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
